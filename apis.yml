apis:
- name: NeuroTherapia Site MCP
  description: 'A remote, anonymous Model Context Protocol server served from the NeuroTherapia corporate
    domain at /_api/mcp. It is provisioned by the Wix website platform rather than authored by NeuroTherapia,
    and exposes nine generic site tools (business details, site search, site API docs search, visitor-token
    minting, and Wix REST API call/execute) over the company''s public website content. It is not a
    NeuroTherapia product or therapeutics-data API. Probed live 2026-08-26: tools/list returned HTTP 200
    with nine tools and real inputSchemas, no authentication required to connect.'
