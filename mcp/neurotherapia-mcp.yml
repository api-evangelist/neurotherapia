  - url
  - method
- name: ExecuteWixAPI
  description: Runs JavaScript against the Wix REST API on the site, on the visitor's behalf, in a sandbox.
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  required:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
