- name: GenerateVisitorToken
  description: Creates a visitor session and returns a visitor access token. Must be called before any
    CallWixSiteAPI or ExecuteWixAPI request.
  parameters: []
- name: CallWixSiteAPI
  description: Calls an API method on the site on a visitor's behalf.
  parameters:
